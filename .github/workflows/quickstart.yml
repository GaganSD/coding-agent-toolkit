name: Quickstart CI

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

concurrency:
  group: quickstart-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quickstart:
    name: Package downloads and root install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify published package downloads and root quickstart
        run: node scripts/quickstart-ci.mjs
