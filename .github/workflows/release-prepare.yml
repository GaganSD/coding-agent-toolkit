name: Prepare release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main SHA
        required: true
        type: string
      packages:
        description: 'Comma-separated path:bump pairs, e.g. pi-ask:patch,pi-slate:minor'
        required: true
        type: string
      notes:
        description: Reviewed release summary (Markdown)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate dispatch source
        env:
          SOURCE: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE" == "$(gh api repos/GaganSD/coding-agent-toolkit/commits/main --jq .sha)" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate deterministic release files
        env:
          SOURCE: ${{ inputs.source_sha }}
          PACKAGES: ${{ inputs.packages }}
          NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=',' read -ra selections <<< "$PACKAGES"
          args=()
          for selection in "${selections[@]}"; do args+=(--package "$selection"); done
          npm run release:apply -- --source-sha "$SOURCE" --notes "$NOTES" "${args[@]}"
      # An App token makes the bot's PR trigger ordinary pull_request CI.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Commit as the app's bot user only. The action otherwise uses the dispatcher as author and
      # github-actions[bot] as committer, so the squash merge credits three identities.
      - name: Resolve app bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "users/${SLUG}%5Bbot%5D" --jq .id)"
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "identity=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          author: ${{ steps.bot.outputs.identity }}
          committer: ${{ steps.bot.outputs.identity }}
          branch: release/next
          base: main
          title: 'chore: prepare npm releases'
          commit-message: 'chore: prepare npm releases'
          body-path: .release/body.md
          add-paths: |
            .release/plan.json
            pi-*/package.json
            pi-*/package-lock.json
            pi-*/CHANGELOG.md
