name: Slate upstream compatibility

on:
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slate-upstream-compatibility
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pi-slate/package-lock.json
      - run: npm ci --prefix pi-slate --ignore-scripts --no-audit --no-fund
      - name: Real interactive baseline
        run: npm run test:compat --prefix pi-slate
      - name: Build and smoke-test artifact
        run: npm run build --prefix pi-slate
      - name: Real interactive latest Pi with packed Slate
        run: npm run test:compat:latest --prefix pi-slate
