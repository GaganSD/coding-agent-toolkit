name: Bot PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: bot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Generated release PRs are machine-checked already; drafts wait.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.ref != 'release/next'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Review the diff and post a PR comment review
        # Skipped quietly until the LLM_API_KEY secret is set.
        if: env.LLM_API_KEY != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: node scripts/bot.mjs review-pr "${{ github.event.pull_request.number }}"
