name: Main CI and releases

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Original main release run whose validated artifacts should be retried
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  eligible:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - id: plan
        run: node scripts/release.mjs check "$(git rev-parse HEAD^1)" "$(git rev-parse HEAD)"

  recovery:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.retry.outputs.sha }}
      run_id: ${{ steps.retry.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - id: retry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
        run: node scripts/release-recovery.mjs retry "$RELEASE_RUN_ID"

  # Wait for publication when applicable, but skip expensive downloads for
  # Herdr/docs-only pushes. Scheduled/manual Quickstart CI remains independent.
  quickstart:
    needs: [validate, eligible, publish]
    if: >-
      always() && !cancelled() &&
      needs.validate.result == 'success' &&
      needs.eligible.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      needs.validate.outputs.run_quickstart == 'true'
    uses: ./.github/workflows/quickstart.yml

  publish:
    needs: [eligible, recovery]
    if: >-
      always() && !cancelled() &&
      (needs.eligible.outputs.release == 'true' || needs.recovery.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Keep current automation separate from the original release source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.recovery.outputs.sha || github.sha }}
          path: .release-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # npm@12 bundles its dependencies but omits `sigstore`, which
      # libnpmpublish needs for provenance. Install it alongside so `npm
      # publish` can resolve it from the global root.
      - run: npm install --global npm@12.0.0 'sigstore@^5.0.0' --ignore-scripts --no-audit --no-fund
      - name: Download only this successful main CI run's artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.recovery.outputs.run_id || github.run_id }}
          pattern: npm-*
          merge-multiple: false
          path: .release-source/.artifacts
      - name: Normalize single-artifact download layout
        run: node scripts/release-recovery.mjs normalize .release-source
      - name: Publish validated tarballs and create package releases
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .release-source
        run: npm run release:publish
